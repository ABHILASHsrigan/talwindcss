<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanishq Replica | Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-white text-gray-800">

    <!-- 🌟 Navbar -->
    <header class="flex items-center justify-between px-6 py-3 shadow-md bg-white">
        <!-- Logo -->
        <div class="flex items-center space-x-3">
            <img src="images/download (1).jpg" alt="Tanishq Logo" class="h-8" style="height: 250px; width: 500px;">
        </div>

        <!-- Search Bar -->
        <div class="relative w-1/2 hidden md:block">
            <input type="text" placeholder="Search for Gold Jewellery, Diamond Jewellery and more..."
                class="w-full border rounded-full px-4 py-2 pl-10 text-sm focus:outline-none">
            <i class="fa fa-search absolute left-3 top-2.5 text-gray-400"></i>
        </div>

        <!-- Icons -->
        <div class="flex items-center space-x-5 text-xl text-gray-700">
            <i class="fa-regular fa-gem cursor-pointer hover:text-amber-600"></i>
            <i class="fa-regular fa-heart cursor-pointer hover:text-amber-600"></i>
            <i class="fa-regular fa-user cursor-pointer hover:text-amber-600"></i>
            <i class="fa-solid fa-bag-shopping cursor-pointer hover:text-amber-600"></i>
        </div>
    </header>

    <!-- 💍 Menu Bar -->
    <nav class="bg-white border-t border-b py-3">
        <ul class="flex flex-wrap justify-center space-x-6 md:space-x-10 text-sm font-medium text-gray-700">
            <li class="hover:text-amber-600 cursor-pointer">All Jewellery</li>
            <li class="hover:text-amber-600 cursor-pointer">Gold</li>
            <li class="hover:text-amber-600 cursor-pointer">Diamond</li>
            <li class="hover:text-amber-600 cursor-pointer">Earrings</li>
            <li class="hover:text-amber-600 cursor-pointer">Rings</li>
            <li class="hover:text-amber-600 cursor-pointer">Daily Wear</li>
            <li class="hover:text-amber-600 cursor-pointer">Collections</li>
            <li class="hover:text-amber-600 cursor-pointer">Wedding</li>
            <li class="hover:text-amber-600 cursor-pointer">Gifting</li>
            <li class="hover:text-amber-600 cursor-pointer">More</li>
        </ul>
    </nav>

    <!-- 🌸 Banner Section -->
    <section
        class="flex flex-col md:flex-row items-center justify-center bg-gradient-to-r from-pink-50 to-orange-50 py-10 px-8 md:px-20">

        <div class="banner"> <img src="images/mriganka-wo-desktop-new.jpg" alt=""
                style="width: 100%; border-radius: 50px ;"></div>
    </section>

    <div class="midpart">
        <h5
            style="color: brown; font-size: 50px; position: absolute; left: 35%; top: 135%; font-family: Georgia, 'Times New Roman', Times, serif;">
            Tanish Collections </h5>
    </div>
    <div>
        <p
            style="position: absolute; left: 38%; top: 145%; font-family: Georgia, 'Times New Roman', Times, serif; word-spacing: 2px; color: gray;">
            Explore our newly launched collection</p>
    </div> <br>

    <div class="photos"><img src="images/festive-edit-desktop.webp" alt=""
            style=" height: 105% ; width: 40%; position: absolute; top: 155%; left: 8%; border-radius: 5px;">

        <img src="images/floral-bloom.webp" alt=""
            style="height: 50% ; width: 40%; position: absolute; top: 210%; left: 49%; border-radius: 5px;">

        <img src="images/stunning-every-ear.webp" alt=""
            style="height: 50% ; width: 40%; position: absolute; top: 155%; left: 49%; border-radius: 5px;">
    </div>


    <div class="im"
        style=" height: 150px; width: 100%; background-color: rgb(243, 225, 174); position: absolute; top: 262%;">

        <h2
            style="color: black; position: absolute; left: 50%; transform: translateX(-50%); top: 30%; font-family: Georgia, 'Times New Roman', Times, serif ; font-size: 30px;">
            Find Your Perfect Match
        </h2>
        <p
            style="position: absolute; left: 45%; top: 70%; font-family: Georgia, 'Times New Roman', Times, serif; word-spacing: 2px; color: gray;">

            Shop by Categories</p>

    </div>


    <div class="section1"> <img src="images/Screenshot (369).png" alt=""
            style=" height: 90%;  position: absolute ; top: 290%; left: 20%;"> </div>
    <div class="section2"> <img src="images/Screenshot (370).png" alt=""
            style=" height: 70%; width: 100%; background-color: rgb(243, 225, 174); position: absolute; top: 382%;">
    </div>
    <div class="section2"> <img src="images/Screenshot (371).png" alt=""
            style=" height: 60%; width: 100%; background-color: rgb(243, 225, 174); position: absolute; top: 459%;">
    </div>


    <div class="section3"  style=" height: 150px; width: 100%; background-color: rgb(243, 225, 174); position: absolute; top: 520%;">
         <h2
            style="color: black; position: absolute; left: 50%; transform: translateX(-50%); top: 30%; font-family: Georgia, 'Times New Roman', Times, serif ; font-size: 30px;">
            Curated For You 
        </h2>

         <p
            style="position: absolute; left: 46%; top: 70%; font-family: Georgia, 'Times New Roman', Times, serif; word-spacing: 2px; color: gray;">

            Shop by Gender</p>

    </div>

    <div class="section4"> <img src="images/Screenshot (372).png" alt=""  style=" height: 30%; width: 100%; background-color: rgb(243, 225, 174); position: absolute; top: 538%;">  </div>
    <div class="section4"> <img src="images/uncle.png" alt=""  style=" height: 50%; width: 100%; background-color: rgb(243, 225, 174); position: absolute; top: 570%;">  </div>

    <div class="section5"> <img src="images/Screenshot (373).png" alt=""  style=" height: 90%; width: 100%; background-color: rgb(243, 225, 174); position: absolute; top: 630%;">  </div>
</body>

</html>
